<!DOCTYPE html>

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    /* Header with Tabs */
    .header {
      background: #fff;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }
    .brand { font-size: 1.5em; font-weight: bold; color: #007bff; }
    .tabs { display: flex; gap: 10px; }
    .tab {
      padding: 5px 15px;
      background: #e9ecef;
      border-radius: 15px;
      font-size: 0.9em;
      cursor: pointer;
      transition: background 0.3s;
    }
    .tab.active { background: #007bff; color: white; }
    .tab:hover { background: #d3d9df; }

    /* Main Content */
    .news-container {
      margin-top: 6px;
      margin-bottom: 60px;
      padding: 10px;
      flex: 1;
    }
    article {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .article-preview { padding: 10px; display: flex; align-items: center; }
    .article-preview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      margin-right: 10px;
    }
    .article-preview-content { flex: 1; position: relative; }
    .article-title {
      font-size: 1.1em;
      font-weight: bold;
      margin: 0 0 5px 0;
      color: #333;
    }
    .article-snippet {
      font-size: 0.85em;
      color: #666;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .timestamp {
      position: absolute;
      top: 0;
      right: 0;
      background: #e9ecef;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7em;
      color: #666;
    }

    /* Full View */
    .article-full { display: none; padding: 10px; position: relative; }
    .article-full img.article-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid #ddd;
    }
    .article-full .article-description {
      font-size: 0.9em;
      color: #666;
      margin: 10px 0;
    }
    .interaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-top: 1px solid #ddd;
    }
    .interaction .footer-button {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9em;
      color: #666;
    }
    .interaction .footer-button i { margin-right: 5px; }
    .post-comments { display: none; padding: 10px; }
    .commentBox { width: 100%; margin-top: 10px; padding: 5px; }
    .comment { display: flex; margin: 5px 0; }
    .comment-avatar { width: 30px; height: 30px; background: #ddd; border-radius: 50%; text-align: center; line-height: 30px; margin-right: 10px; }

    /* News Form */
    .news-form {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: none;
    }
    .news-form input, .news-form textarea, .news-form select {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .news-form button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .news-form button:hover { background: #0056b3; }

    /* Bottom Navigation */
    .bottom-nav {
      background: #fff;
      padding: 10px;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 1000;
    }
    .bottom-nav button {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.8em;
      color: #666;
    }
    .bottom-nav button i { font-size: 1.2em; }
    .bottom-nav button.active { color: #007bff; }

    /* Fullscreen Modal */
    #fullscreen-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 1000;
      color: white;
      padding: 20px;
    }
    #fullscreen-modal.active { display: block; }
    #fullscreen-video { width: 100%; height: 70%; }
    #fullscreen-modal button { float: right; padding: 5px 10px; }

    /* User Info */
    #user-info { margin-left: 10px; }
    #profilePicture { width: 40px; height: 40px; border-radius: 50%; }
  </style>
</head>

// Format timestamp
function formatTime(timestamp) {
  if (!timestamp) return "Unknown time";
  const now = Date.now();
  const diff = now - timestamp;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);

  if (seconds < 60) return "Just now";
  if (minutes < 60) return `${minutes}m ago`;
  if (hours < 24) return `${hours}h ago`;
  return `${days}d ago`;
}

// Truncate content for preview
function truncateContent(content, maxLength = 100) {
  if (content.length <= maxLength) return content;
  return content.substring(0, maxLength) + "...";
}

// Fetch and display news articles (newest to oldest)
function fetchNews() {
  if (!newsContainer) return;
  const newsRef = ref(database, "news");
  const newsQuery = query(newsRef, orderByChild("timestamp"));

  onValue(newsQuery, (snapshot) => {
    newsContainer.innerHTML = "";
    const articles = [];

    snapshot.forEach((childSnapshot) => {
      const article = childSnapshot.val();
      article.id = childSnapshot.key;
      articles.push(article);
    });

    // Sort articles by timestamp (newest first) as a fallback
    articles.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    articles.forEach((article) => {
      const articleHTML = `
        <article data-id="${article.id}">
          <div class="article-preview">
            <img src="${article.fileURL || 'https://via.placeholder.com/80x80'}" alt="${article.title || 'Article Image'}">
            <div class="article-preview-content">
              <h2 class="article-title">${article.title || "Untitled"}</h2>
              <p class="article-snippet">${truncateContent(article.content || "")}</p>
              <span class="timestamp">${formatTime(article.timestamp)}</span>
            </div>
          </div>
          <div class="article-full">
            <img src="${article.fileURL || 'https://via.placeholder.com/300x200'}" alt="${article.title || 'Article Image'}" class="article-image">
            <div class="article-content">
              <span class="timestamp">${formatTime(article.timestamp)}</span>
              <h2 class="article-title">${article.title || "Untitled"}</h2>
              <p class="article-description">${article.content || ""}</p>
              ${
                article.fileURL && !article.fileType.startsWith("image/")
                  ? article.fileType.startsWith("video/")
                    ? `<video controls src="${article.fileURL}" class="article-image" aria-label="Video content"></video>`
                    : article.fileType.startsWith("audio/")
                      ? `<audio controls src="${article.fileURL}" class="article-image" aria-label="Audio content"></audio>`
                      : `<a href="${article.fileURL}" target="_blank" aria-label="Download file">Download File</a>`
                  : ""
              }
              <div class="interaction">
                <button class="footer-button like-button" aria-label="Like article">
                  <i class="fas fa-thumbs-up"></i> <span>${Object.keys(article.likes || {}).length}</span>
                </button>
                <button class="footer-button toggle-comments-button" aria-label="Comment on article">
                  <i class="fas fa-comment"></i> <span>${Object.keys(article.comments || {}).length}</span>
                </button>
                <button class="footer-button" aria-label="Retweet article">
                  <i class="fas fa-retweet"></i>
                </button>
                <button class="footer-button" aria-label="Share article">
                  <i class="fas fa-share-alt"></i>
                </button>
              </div>
              <div class="post-comments" style="display: none;">
                <button class="commentButton" aria-label="Submit comment">Comment</button>
                <div class="comments">
                  <textarea class="commentBox" placeholder="Write a comment..." aria-label="Comment input"></textarea>
                  ${Object.entries(article.comments || {})
                    .map(([id, comment]) => `
                      <div class="comment">
                        <div class="comment-avatar">${(comment.author || "A").charAt(0)}</div>
                        <div class="comment-content">
                          <div class="comment-author">${comment.author || "Anonymous"}</div>
                          <div class="comment-text">${comment.text}</div>
                        </div>
                      </div>`
                    )
                    .join("")}
                </div>
              </div>
            </div>
          </div>
        </article>
      `;
      newsContainer.innerHTML += articleHTML;
    });
  }, (error) => {
    console.error("Error fetching news:", error);
    newsContainer.innerHTML = "<p>Error loading news articles.</p>";
  });

  // Event delegation for article interactions
  if (newsContainer) {
    newsContainer.addEventListener("click", (e) => {
      const articleElement = e.target.closest("article");
      if (!articleElement) return;

      const articleId = articleElement.dataset.id;
      const user = auth.currentUser;

      // Like button functionality
      if (e.target.classList.contains("like-button") || e.target.closest(".like-button")) {
        if (!user) {
          alert("Please sign in to like articles");
          return;
        }
        const likesRef = ref(database, `news/${articleId}/likes/${user.uid}`);
        runTransaction(likesRef, (currentValue) => {
          return currentValue ? null : true;
        }).then(() => {
          fetchNews();
        }).catch((error) => {
          console.error("Error updating like:", error);
        });
      }

      // Toggle comments section
      if (e.target.classList.contains("toggle-comments-button") || e.target.closest(".toggle-comments-button")) {
        const commentsSection = articleElement.querySelector(".post-comments");
        commentsSection.style.display = commentsSection.style.display === "none" ? "block" : "none";
      }

      // Submit comment functionality
      if (e.target.classList.contains("commentButton")) {
        const commentsSection = articleElement.querySelector(".post-comments");
        const commentTextarea = commentsSection.querySelector(".commentBox");
        const commentText = commentTextarea.value.trim();

        if (!commentText) return;

        if (!user) {
          alert("Please sign in to comment");
          return;
        }

        const commentsRef = ref(database, `news/${articleId}/comments`);
        const newComment = {
          text: commentText,
          author: user.displayName || "Anonymous",
          profilePicture: user.photoURL || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png",
          timestamp: Date.now()
        };

        push(commentsRef, newComment).then(() => {
          commentTextarea.value = "";
          fetchNews();
        }).catch((error) => {
          console.error("Error posting comment:", error);
        });
      }
    });
  }
}

// Fullscreen video functions
window.openFullscreen = (url, articleId, title, channel, stats) => {
  const fullscreenVideo = document.getElementById("fullscreen-video");
  const fullscreenTitle = document.getElementById("fullscreen-title");
  const fullscreenChannel = document.getElementById("fullscreen-channel");
  const fullscreenStats = document.getElementById("fullscreen-stats");
  const fullscreenModal = document.getElementById("fullscreen-modal");
  const commentsContainer = document.getElementById("comments-container");

  if (!fullscreenVideo || !fullscreenModal) {
    console.error("Fullscreen elements not found");
    return;
  }

  fullscreenVideo.src = url;
  fullscreenVideo.autoplay = true;
  fullscreenVideo.muted = false;
  fullscreenVideo.controls = true;

  if (fullscreenTitle) fullscreenTitle.textContent = title;
  if (fullscreenChannel) fullscreenChannel.textContent = channel;
  if (fullscreenStats) fullscreenStats.textContent = stats;
  fullscreenModal.classList.add("active");

  if (commentsContainer) {
    const commentsRef = ref(database, `news/${articleId}/comments`);
    const commentsQuery = query(commentsRef, orderByChild("timestamp"));
    onValue(commentsQuery, (snapshot) => {
      commentsContainer.innerHTML = "";
      const comments = [];

      snapshot.forEach((childSnapshot) => {
        const comment = childSnapshot.val();
        comment.id = childSnapshot.key;
        comments.push(comment);
      });

      comments.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      comments.forEach((comment) => {
        const commentHTML = `
          <div class="comment">
            <div class="comment-avatar">${(comment.author || "A").charAt(0)}</div>
            <div class="comment-content">
              <div class="comment-author">${comment.author || "Anonymous"}</div>
              <div class="comment-text">${comment.text}</div>
            </div>
          </div>
        `;
        commentsContainer.innerHTML += commentHTML;
      });
    }, (error) => {
      console.error("Error fetching comments:", error);
    });
  }
};

window.closeFullscreen = () => {
  const fullscreenVideo = document.getElementById("fullscreen-video");
  const fullscreenModal = document.getElementById("fullscreen-modal");
  if (fullscreenVideo && fullscreenModal) {
    fullscreenVideo.pause();
    fullscreenVideo.src = "";
    fullscreenModal.classList.remove("active");
  }
};

// Fetch and display groups
let groups = [];
let currentIndex = 0;
let currentGroupId = null;

function fetchGroups() {
  if (!groupDisplayContainer) return;
  const groupsRef = ref(database, "groups");
  onValue(groupsRef, (snapshot) => {
    groups = [];
    snapshot.forEach((childSnapshot) => {
      const group = childSnapshot.val();
      group.id = childSnapshot.key;
      groups.push(group);
    });
    displayGroups();
  }, (error) => {
    console.error("Error fetching groups:", error);
    if (groupDisplayContainer) groupDisplayContainer.innerHTML = "<p>Error loading groups.</p>";
  });
}

function displayGroups() {
  if (!groupDisplayContainer) return;
  groupDisplayContainer.innerHTML = "";
  groupDisplayContainer.style.display = "flex";
  const selectedGroups = groups.slice(currentIndex, currentIndex + 3);
  if (selectedGroups.length < 3 && groups.length > 0) {
    selectedGroups.push(...groups.slice(0, 3 - selectedGroups.length));
  }
  
  selectedGroups.forEach((group) => {
    const categoryIcon = categoryIcons[group.category] || "";
    const groupBlockHTML = `
      <button class="suImg" data-id="${group.id}">
        <div class="avatar">
          <i class="${categoryIcon} category-icon"></i>
        </div>
        <img src="${group.imageURL || "https://via.placeholder.com/100x60"}" alt="${group.name || "Group"}" class="imgReal">
        <div class="group-name">${group.name || "Unnamed Group"}</div>
      </button>
    `;
    groupDisplayContainer.innerHTML += groupBlockHTML;
  });
  
  // Attach click handlers to group cards
  document.querySelectorAll(".suImg").forEach(button => {
    button.addEventListener("click", () => {
      currentGroupId = button.dataset.id;
      loadGroupChat(currentGroupId);
    });
  });
  
  currentIndex = (currentIndex + 3) % (groups.length || 1);
}

// Rotate groups every 30 seconds
if (groupDisplayContainer) {
  setInterval(() => {
    if (groups.length > 0) {
      displayGroups();
    }
  }, 30000);
}

// Load and display group chat
function loadGroupChat(groupId) {
  if (!groupChat || !chatMessages) return;
  const groupRef = ref(database, `groups/${groupId}`);
  onValue(groupRef, (snapshot) => {
    const group = snapshot.val();
    if (group) {
      document.querySelector(".group-name").textContent = group.name || "Group Chat";
      groupDisplayContainer.style.display = "none";
      groupChat.style.display = "flex";
      fetchGroupMessages(groupId);
    }
  }, (error) => {
    console.error("Error loading group:", error);
  });
}

// Fetch and display messages
function fetchGroupMessages(groupId) {
  if (!chatMessages) return;
  const messagesRef = ref(database, `groups/${groupId}/messages`);
  onValue(messagesRef, (snapshot) => {
    chatMessages.innerHTML = "";
    snapshot.forEach((childSnapshot) => {
      const message = childSnapshot.val();
      const isSent = message.author === auth.currentUser?.email;
      const messageHTML = `
        <div class="message ${isSent ? "sent" : "received"}">
          <div class="author">${message.author || "Anonymous"}</div>
          <div class="text">${message.text}</div>
          <div class="time">${formatTime(message.timestamp)}</div>
        </div>
      `;
      chatMessages.innerHTML += messageHTML;
    });
    chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll to latest message
  }, (error) => {
    console.error("Error fetching messages:", error);
  });
}

// Send message to group
function sendMessageToGroup(groupId, text) {
  const user = auth.currentUser;
  if (!user) return;
  const messagesRef = ref(database, `groups/${groupId}/messages`);
  const newMessage = {
    text,
    author: user.email || "Anonymous",
    profilePicture: user.photoURL || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png",
    timestamp: Date.now()
  };
  push(messagesRef, newMessage)
    .catch((error) => {
      console.error("Error sending message:", error);
    });
}
