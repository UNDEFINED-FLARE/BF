];
const DEMO_SELLERS = {
  s1: { shopName: "Mama T's Kitchen", ownerName: 'Thabo', category: 'Food', location: 'East Campus' },
  s2: { shopName: 'Campus Prints', ownerName: 'Lerato', category: 'Printing', location: 'Library Block' },
  s3: { shopName: 'TechHub Venda', ownerName: 'Given', category: 'Electronics', location: 'Student Centre' },
  s4: { shopName: 'Style & Thread', ownerName: 'Naledi', category: 'Clothing', location: 'Arts Quad' },
};

// ===== STATE =====
let allListings = [...DEMO_PRODUCTS];
let currentCat = 'all';
let searchQ = '';
let sortBy = 'newest';
let orderProduct = null;
let orderQty = 1;
let wishlist = JSON.parse(localStorage.getItem('vm_wishlist') || '[]');

// ===== UTILITIES =====
const $ = id => document.getElementById(id);
function esc(s){ if(!s)return''; return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function catEmoji(cat){ return{Food:'🍔',Clothing:'👕',Printing:'🖨️',Beauty:'💇',Services:'📚',Electronics:'📱',Stationery:'✏️',Groceries:'🛒'}[cat]||'🏪'; }
function formatPrice(p){ return 'R '+Number(p).toFixed(2); }
let toastTimer;
function toast1(msg,type='',dur=3500){ const el=$('toast1'); if(!el)return; el.textContent=msg; el.className='toast1 '+(type||''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{if(el)el.className='toast1 hidden';},dur); }
function saveWishlist(){ localStorage.setItem('vm_wishlist',JSON.stringify(wishlist)); updateWishlistBadge(); }
function updateWishlistBadge(){ const b=$('wishlist-count-badge'); if(!b)return; if(wishlist.length>0){b.textContent=wishlist.length;b.classList.remove('hidden');} else b.classList.add('hidden'); }

// ===== RENDER =====
function filteredListings(){
  let arr=[...allListings];
  if(currentCat!=='all') arr=arr.filter(l=>l.category===currentCat);
  if(searchQ.trim()){ const q=searchQ.toLowerCase(); arr=arr.filter(l=>(l.title||'').toLowerCase().includes(q)||(l.shopName||'').toLowerCase().includes(q)||(l.description||'').toLowerCase().includes(q)); }
  if(sortBy==='price-asc') arr.sort((a,b)=>a.price-b.price);
  else if(sortBy==='price-desc') arr.sort((a,b)=>b.price-a.price);
  else if(sortBy==='rating') arr.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else arr.sort((a,b)=>b.createdAt-a.createdAt);
  return arr;
}

function renderListings(){
  const arr=filteredListings();
  const grid=$('cards-grid'),rc=$('result-count');
  if(!grid||!rc)return;
  rc.textContent=`${arr.length} product${arr.length!==1?'s':''} found`;
  if(arr.length===0){ grid.innerHTML=`<div class="empty-state"><div class="empty-icon">🛒</div><h3>No products</h3><p>Check back later!</p></div>`; return; }
  grid.innerHTML=arr.map((item,i)=>{
    const liked=wishlist.includes(item.id);
    const stars=item.rating>0?'⭐'.repeat(Math.min(5,Math.round(item.rating))):'— new';
    const hasImg=item.images&&item.images.length>0&&item.images[0];
    const imgHtml=hasImg?`<img class="product-img" src="${item.images[0]}" alt="${esc(item.title)}" loading="lazy">`:`<span class="cat-emoji">${catEmoji(item.category)}</span>`;
    return `<div class="card fade-up" style="animation-delay:${i*0.04}s" data-id="${item.id}">
      <div class="card-img">${imgHtml}<span class="card-badge">${esc(item.category)}</span><button class="wishlist-btn ${liked?'liked':''}" data-wid="${item.id}" onclick="event.stopPropagation();toggleWishlist('${item.id}')"><i class="fa${liked?'s':'r'} fa-heart"></i></button></div>
      <div class="card-body">
        <div class="card-top"><div class="card-title">${esc(item.title)}</div><div class="card-price">${formatPrice(item.price)}</div></div>
        <div class="card-shop" data-sellerid="${item.sellerId||''}" onclick="event.stopPropagation();openSellerProfile('${item.sellerId||''}')"><i class="fas fa-store" style="font-size:.7rem;color:var(--green)"></i> ${esc(item.shopName)}</div>
        <div class="card-rating"><span>${stars}</span>${item.reviewCount?`<span style="color:var(--muted)"> (${item.reviewCount})</span>`:''}</div>
        <p class="card-desc">${esc((item.description||'').substring(0,70))}${(item.description||'').length>70?'…':''}</p>
        <div class="card-actions">
          <button class="btn-wa" onclick="event.stopPropagation();waContact('${item.whatsapp}','${esc(item.title)}','${esc(item.shopName)}')"><i class="fab fa-whatsapp" style="color:peru;padding:5px;";></i> Order on WhatsApp</button>
          <button class="btn-order" onclick="event.stopPropagation();openOrder('${item.id}')"><i class="fab fa-whatsapp"></i> Order</button>
        </div>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.card[data-id]').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.id)));
}

// ===== SELLER PROFILE =====
function openSellerProfile(sellerId){
  if(!sellerId || !DEMO_SELLERS[sellerId]){ toast1('Seller not found','error'); return; }
  const seller = DEMO_SELLERS[sellerId];
  const products = allListings.filter(p => p.sellerId === sellerId);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const profileScreen=$('seller-profile-screen');
  if(profileScreen) profileScreen.classList.add('active');
  const body=$('profile-body'); if(!body)return;
  const totalSales = products.filter(p => p.soldOut).length;
  body.innerHTML=`
    <div class="profile-header">
      <div class="profile-avatar">${(seller.shopName||'?')[0].toUpperCase()}</div>
      <div class="profile-info">
        <h1>${esc(seller.shopName)}</h1>
        <div class="sub"><span><i class="fas fa-user"></i> ${esc(seller.ownerName||'Student seller')}</span><span><i class="fas fa-tag"></i> ${esc(seller.category||'General')}</span>${seller.location?`<span><i class="fas fa-map-marker-alt"></i> ${esc(seller.location)}</span>`:''}</div>
        <div class="profile-stats"><span>📦 ${products.length} products</span><span>⭐ ${seller.rating||'new'}</span><span>✅ ${totalSales} sold</span></div>
      </div>
      <button class="back-btn" onclick="closeProfile()"><i class="fas fa-arrow-left"></i> Back</button>
    </div>
    <div style="padding:0 1rem .5rem;"><h3 style="font-size:1rem;font-family:'Sora',sans-serif;">📦 Products by ${esc(seller.shopName)}</h3></div>
    <div class="seller-product-grid">
      ${products.length===0?`<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">📦</div><h3>No products listed</h3></div>`:
      products.map(p=>{
        const liked=wishlist.includes(p.id);
        const hasImg=p.images&&p.images[0];
        return `<div class="card fade-up" data-id="${p.id}" style="cursor:pointer;">
          <div class="card-img">${hasImg?`<img class="product-img" src="${p.images[0]}" alt="${esc(p.title)}">`:`<span class="cat-emoji">${catEmoji(p.category)}</span>`}<span class="card-badge">${esc(p.category)}</span><button class="wishlist-btn ${liked?'liked':''}" onclick="event.stopPropagation();toggleWishlist('${p.id}')"><i class="fa${liked?'s':'r'} fa-heart"></i></button></div>
          <div class="card-body"><div class="card-top"><div class="card-title">${esc(p.title)}</div><div class="card-price">${formatPrice(p.price)}</div></div><div class="card-rating">${p.rating?'⭐'.repeat(Math.min(5,Math.round(p.rating))):'—'}</div><div class="card-actions"><button class="btn-wa" onclick="event.stopPropagation();waContact('${p.whatsapp}','${esc(p.title)}','${esc(p.shopName)}')"><i class="fab fa-whatsapp"></i></button><button class="btn-order" onclick="event.stopPropagation();openOrder('${p.id}')"><i class="fab fa-whatsapp"></i> Order</button></div></div>
        </div>`;
      }).join('')}
    </div>
  `;
  document.querySelectorAll('.seller-product-grid .card[data-id]').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.id)));
}

function closeProfile(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const ms=$('marketplace-screen'); if(ms)ms.classList.add('active');
  renderListings();
}

// ===== TOGGLE WISHLIST, WA, ORDER =====
function toggleWishlist(id){ if(wishlist.includes(id)) wishlist=wishlist.filter(w=>w!==id); else{wishlist.push(id);toast1('❤️ Added to wishlist!');} saveWishlist(); renderListings(); }
function waContact(wa,title,shop){ const clean=(wa||'').replace(/\D/g,''); if(!clean){toast1('No WhatsApp','error');return;} window.open(`https://wa.me/${clean}?text=${encodeURIComponent('Hi! I saw your '+title+' from '+shop+' on Venda Market. Is it available?')}`,'_blank'); }

// ===== ORDER MODAL =====
function openOrder(id){
  const p=allListings.find(l=>l.id===id); if(!p)return;
  orderProduct=p; orderQty=1; const qd=$('qty-display'); if(qd)qd.textContent=1; updateOrderTotal();
  const op=$('order-product-preview'); if(op){ const img=(p.images&&p.images[0])?`<img class="order-product-img" src="${p.images[0]}" style="width:60px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0;">`:`<div style="font-size:2.5rem;">${catEmoji(p.category)}</div>`; op.innerHTML=`<div class="order-product-card" style="display:flex;align-items:center;gap:12px;background:var(--surface);padding:.85rem;border-radius:var(--r-md);">${img}<div><h4>${esc(p.title)}</h4><div class="price-tag">${formatPrice(p.price)}</div><div class="shop-tag">${esc(p.shopName)}</div></div></div>`; }
  const modal=$('order-modal'); if(modal)modal.classList.remove('hidden');
}
function updateOrderTotal(){ if(!orderProduct)return; const ot=$('order-total'); if(ot)ot.textContent=formatPrice(orderProduct.price*orderQty); }

// ===== DETAIL DRAWER =====
function openDetail(id){
  const p=allListings.find(l=>l.id===id); if(!p)return;
  const dc=$('detail-content'); if(!dc)return;
  const liked=wishlist.includes(id);
  dc.innerHTML=`
    <div class="modal-header"><span></span><button class="close-btn" onclick="document.getElementById('detail-drawer').classList.add('hidden')">&times;</button></div>
    <div style="text-align:center;font-size:3rem;margin:.5rem 0;">${p.images&&p.images[0]?`<img src="${p.images[0]}" style="width:100%;max-height:200px;object-fit:cover;border-radius:var(--r-md);">`:`<span class="cat-emoji">${catEmoji(p.category)}</span>`}</div>
    <div style="display:flex;justify-content:space-between;"><h2 class="syne">${esc(p.title)}</h2><div class="detail-price">${formatPrice(p.price)}</div></div>
    <div class="detail-shop" onclick="document.getElementById('detail-drawer').classList.add('hidden');openSellerProfile('${p.sellerId||''}')"><div class="shop-avatar">${(p.shopName||'?')[0].toUpperCase()}</div><div><strong>${esc(p.shopName)}</strong><br><small style="color:var(--muted)">View profile →</small></div></div>
    <p style="color:var(--text-soft);font-size:.88rem;line-height:1.65;margin-bottom:1rem;">${esc(p.description||'No description.')}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem;"><button class="btn-full btn-full-wa" onclick="waContact('${p.whatsapp}','${esc(p.title)}','${esc(p.shopName)}')"><i class="fab fa-whatsapp"></i> WhatsApp</button></div>
    <button style="width:100%;padding:.7rem;border-radius:40px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-weight:600;margin-top:.7rem;color:${liked?'var(--danger)':'var(--muted)'};" onclick="toggleWishlist('${p.id}');document.getElementById('detail-drawer').classList.add('hidden')"><i class="fa${liked?'s':'r'} fa-heart"></i> ${liked?'Remove from Wishlist':'Save'}</button>`;
  const dd=$('detail-drawer'); if(dd)dd.classList.remove('hidden');
}

// ===== SELLER DASHBOARD =====
function openSeller(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const ss=$('seller-screen'); if(ss)ss.classList.add('active');
  const sb=$('seller-body'); if(!sb)return;
  sb.innerHTML=`
    <div style="padding:1rem;">
      <div style="display:flex;align-items:center;gap:12px;background:var(--surface);padding:1rem;border-radius:var(--r-md);margin-bottom:1rem;">
        <div class="shop-avatar" style="width:50px;height:50px;font-size:1.4rem;">🏪</div>
        <div><div style="font-weight:700;">Demo Seller</div><div style="font-size:.8rem;color:var(--muted);">Student seller · All categories</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:1rem;">
        <button class="btn-full btn-full-green" style="width:auto;padding:.4rem .9rem;" onclick="toast1('🚀 Add product: use the demo data array','success')"><i class="fas fa-plus"></i> Add Product</button>
        <button class="btn-full btn-full-gold" style="width:auto;padding:.4rem .9rem;background:var(--gold);color:#fff;border:none;border-radius:10px;cursor:pointer;" onclick="closeProfile()"><i class="fas fa-arrow-left"></i> Back</button>
      </div>
      <h3>Your Products (${allListings.length})</h3>
      ${allListings.map(l=>`<div class="listing-row" style="display:flex;justify-content:space-between;padding:.7rem;background:var(--surface);border-radius:var(--r-md);margin-top:.5rem;"><div><strong>${esc(l.title)}</strong> ${formatPrice(l.price)}</div><div><button class="btn-sm btn-danger" style="padding:0.2rem 0.6rem;border-radius:6px;border:none;font-size:0.7rem;font-weight:600;cursor:pointer;background:#fee;color:var(--danger);" onclick="toast1('Demo: remove from array','')"><i class="fas fa-trash"></i></button></div></div>`).join('')}
    </div>
  `;
}

// ===== EVENT BINDINGS =====
document.addEventListener('DOMContentLoaded',()=>{
  const si=$('market-search'); if(si) si.addEventListener('input',e=>{searchQ=e.target.value;renderListings();});
  const sb=$('search-btn'); if(sb) sb.addEventListener('click',()=>renderListings());
  const ss=$('sort-select'); if(ss) ss.addEventListener('change',e=>{sortBy=e.target.value;renderListings();});
  
  // Category filters - removed because we only show Food category for this demo, but keep for flexibility
  // We'll just hide category pills since we only have Food items
  const catsContainer = document.querySelector('.cats');
  if(catsContainer) catsContainer.style.display = 'none';
  
  // back buttons
  const backMarket=$('back-to-market-btn'); if(backMarket) backMarket.addEventListener('click',()=>{ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); const ms=$('marketplace-screen'); if(ms)ms.classList.add('active'); renderListings(); });
  const backProfile=$('back-from-profile-btn'); if(backProfile) backProfile.addEventListener('click',closeProfile);
  const backMarket2=$('back-market-btn'); if(backMarket2) backMarket2.addEventListener('click',()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const ms=$('marketplace-screen');if(ms)ms.classList.add('active');});
  
  // wishlist nav
  const wb=$('wishlist-nav-btn'); if(wb) wb.addEventListener('click',()=>{ if(wishlist.length===0){toast1('Wishlist empty');return;} const arr=allListings.filter(l=>wishlist.includes(l.id)); const grid=$('cards-grid'),rc=$('result-count'); if(!grid)return; rc.textContent=`${arr.length} wishlist items`; grid.innerHTML=`<div style="grid-column:1/-1;display:flex;justify-content:space-between;padding:.5rem;"><h3><i class="fas fa-heart" style="color:var(--danger)"></i> Wishlist</h3><button style="background:none;border:none;color:var(--muted);cursor:pointer;" onclick="renderListings()">← All</button></div>`+arr.map(item=>`<div class="card" data-id="${item.id}"><div class="card-img">${item.images&&item.images[0]?`<img src="${item.images[0]}" style="width:100%;height:100%;object-fit:cover;">`:`<span class="cat-emoji">${catEmoji(item.category)}</span>`}<button class="wishlist-btn liked" onclick="event.stopPropagation();toggleWishlist('${item.id}')"><i class="fas fa-heart"></i></button></div><div class="card-body"><div class="card-top"><div class="card-title">${esc(item.title)}</div><div class="card-price">${formatPrice(item.price)}</div></div><div class="card-actions"><button class="btn-wa" onclick="event.stopPropagation();waContact('${item.whatsapp}','${esc(item.title)}','${esc(item.shopName)}')"><i class="fab fa-whatsapp"></i></button><button class="btn-order" onclick="event.stopPropagation();openOrder('${item.id}')"><i class="fab fa-whatsapp"></i> Order</button></div></div></div>`).join(''); document.querySelectorAll('.card[data-id]').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.id))); });
  
  // order modal controls
  const qm=$('qty-minus'),qp=$('qty-plus'); if(qm)qm.addEventListener('click',()=>{if(orderQty>1)orderQty--;const qd=$('qty-display');if(qd)qd.textContent=orderQty;updateOrderTotal();}); if(qp)qp.addEventListener('click',()=>{orderQty++;const qd=$('qty-display');if(qd)qd.textContent=orderQty;updateOrderTotal();});
  const com=$('close-order-modal'); if(com)com.addEventListener('click',()=>{const om=$('order-modal');if(om)om.classList.add('hidden');});
  
  // WhatsApp order
  const wo=$('whatsapp-order-btn'); if(wo)wo.addEventListener('click',()=>{ 
    if(!orderProduct)return; 
    const name=$('buyer-name')?.value.trim()||'Student'; 
    const phone=$('buyer-phone')?.value.trim()||''; 
    const note=$('order-note')?.value.trim()||''; 
    const wa=orderProduct.whatsapp?.replace(/\D/g,''); 
    if(!wa){toast1('Seller WhatsApp missing','error');return;} 
    let msg=`Hi! I'd like to order ${orderProduct.title} ×${orderQty} = ${formatPrice(orderProduct.price*orderQty)} from ${orderProduct.shopName}. My name: ${name}.`;
    if(phone) msg+=`\nMy WhatsApp: ${phone}`;
    if(note) msg+=`\nNote: ${note}`;
    window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`,'_blank');
    const modal=$('order-modal'); if(modal)modal.classList.add('hidden');
  });
  
  // seller button
  const osb=$('open-seller-btn'); if(osb)osb.addEventListener('click',openSeller);
  
  // close modals on backdrop
  const dd=$('detail-drawer'); if(dd)dd.addEventListener('click',e=>{if(e.target===dd)dd.classList.add('hidden');});
  const om=$('order-modal'); if(om)om.addEventListener('click',e=>{if(e.target===om)om.classList.add('hidden');});
});

// ===== INIT =====
updateWishlistBadge();
renderListings();

</script>
</body>
</html>
