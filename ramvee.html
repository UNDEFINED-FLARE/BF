<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramvee's Fresh · Order on WhatsApp</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="https://i.ibb.co/YBmf408h/file-00000000815c71f4a1050089e98e3d5b.png" type="image/png">
<style>
/* ============================================================
   RAMVEE'S FRESH — bold campus food-stall identity
   Palette: ink #1A1A2E · flame #FF4B1F · gold #FFC93C
            fresh #0FA968 · cream #FFF6E9 · paper #FFFFFF
   Type: Sora (display, heavy) + DM Sans (body/UI)
   Signature: torn-ticket hero + rotated stamp badges
   ============================================================ */

:root{
  --ink:#1A1A2E;
  --flame:#FF4B1F;
  --flame-dark:#E33B12;
  --gold:#FFC93C;
  --fresh:#0FA968;
  --fresh-dark:#0C8A56;
  --cream:#FFF6E9;
  --paper:#FFFFFF;
  --line:#1A1A2E;
  --muted:#6B6B80;
  --wa:#1FA855;
  --wa-dark:#168842;
  --shadow:0 4px 0 var(--ink);
  --shadow-sm:0 2px 0 var(--ink);
  --r-sm:10px;
  --r-md:16px;
  --r-lg:22px;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--cream);
  color:var(--ink);
  padding-bottom:48px;
  overflow-x:hidden;
}
img{max-width:100%;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
.syne, h1,h2,h3,h4{font-family:'Sora',sans-serif;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important;}
}

/* ===== TOP BAR ===== */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--ink);
  color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0.65rem 1rem;
  border-bottom:3px solid var(--ink);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{width:36px;height:36px;border-radius:9px;background:#fff;padding:3px;border:2px solid var(--ink);}
.brand-text{line-height:1.15;}
.brand-name{font-family:'Sora',sans-serif;font-size:1rem;font-weight:800;letter-spacing:-0.2px;}
.brand-name em{color:var(--gold);font-style:normal;}
.brand-sub{font-size:0.6rem;color:rgba(255,255,255,.65);letter-spacing:1px;font-weight:600;text-transform:uppercase;}
.status-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--fresh);
  color:#fff;font-size:0.65rem;font-weight:700;
  padding:5px 10px;border-radius:30px;
  border:2px solid var(--ink);
}
.status-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== HERO: torn ticket stub ===== */
.hero{
  position:relative;
  background:var(--flame);
background-image:url("");
  padding:1.6rem 1.2rem 2.4rem;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.10) 0, rgba(255,255,255,.10) 6px, transparent 7px),
    radial-gradient(circle at 85% 75%, rgba(255,255,255,.10) 0, rgba(255,255,255,.10) 6px, transparent 7px),
    radial-gradient(circle at 50% 90%, rgba(255,255,255,.08) 0, rgba(255,255,255,.08) 5px, transparent 6px);
  pointer-events:none;
}
.ticket{
  position:relative;
  background:var(--paper);
background-size:100;
  border:3px solid var(--ink);
  border-radius:18px;
  padding:1.2rem 1.1rem 1.4rem;
  box-shadow:var(--shadow);
  transform:rotate(-1deg);
}
.ticket::before,.ticket::after{
  content:"";
  position:absolute;
  width:22px;height:22px;
  background:var(--flame);
  border-radius:50%;
  border:3px solid var(--ink);
  top:50%;transform:translateY(-50%);
}
.ticket::before{left:-14px;}
.ticket::after{right:-14px;}
.ticket-top{display:flex;align-items:center;gap:12px;margin-bottom:0.9rem;}
.ticket-logo{width:52px;height:52px;border-radius:12px;border:2.5px solid var(--ink);flex-shrink:0;object-fit:cover;}
.ticket-eyebrow{
  display:inline-flex;align-items:center;gap:5px;
  font-size:0.62rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--flame-dark);margin-bottom:2px;
}
.hero h1{
  font-size:1.55rem;font-weight:800;line-height:1.1;letter-spacing:-0.5px;
}
.hero h1 span{color:var(--flame);}
.ticket-meta{
  display:flex;gap:14px;margin-top:0.85rem;padding-top:0.85rem;
  border-top:2px dashed var(--ink);
  font-size:0.72rem;font-weight:600;color:var(--ink);
}
.ticket-meta div{display:flex;align-items:center;gap:5px;}
.ticket-meta i{color:var(--flame);}
.hero-cta{
  display:flex;gap:10px;margin-top:1rem;
}
.btn-stamp{
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:0.7rem 0.5rem;
  border-radius:30px;
  border:2.5px solid var(--ink);
  font-weight:700;font-size:0.82rem;
  cursor:pointer;
  transition:transform .12s;
}
.btn-stamp:active{transform:scale(.96);}
.btn-stamp.primary{background:var(--ink);color:#fff;}
.btn-stamp.ghost{background:#fff;color:var(--ink);}

/* ===== SEARCH / FILTER STRIP ===== */
.search-wrap{padding:1.1rem 1rem 0.4rem;}
.search-row{
  display:flex;gap:8px;align-items:center;
  background:var(--paper);
  border:2.5px solid var(--ink);
  border-radius:30px;
  padding:0.2rem 0.2rem 0.2rem 1rem;
}
.search-input-wrap{flex:1;display:flex;align-items:center;gap:8px;}
.search-input-wrap i{color:var(--muted);}
.search-input-wrap input{
  border:none;background:transparent;
  padding:0.65rem 0;font-size:0.9rem;width:100%;outline:none;
  font-family:'DM Sans',sans-serif;color:var(--ink);
}
.btn-search{
  background:var(--flame);border:2.5px solid var(--ink);
  border-radius:50%;width:38px;height:38px;
  color:#fff;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.menu-divider{
  display:flex;align-items:center;gap:10px;
  margin:1rem 0 0.3rem;
}
.menu-divider .line{flex:1;height:2px;background:var(--ink);opacity:.12;}
.menu-divider span{
  font-family:'Sora',sans-serif;font-weight:800;font-size:0.95rem;
  color:var(--ink);white-space:nowrap;
}
.sort-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:0.4rem 1rem 0.2rem;font-size:0.72rem;color:var(--muted);
}
.result-count{font-weight:700;color:var(--ink);}
.sort-select{
  border:2px solid var(--ink);border-radius:20px;
  padding:0.3rem 0.7rem;font-size:0.7rem;background:#fff;
  font-weight:600;color:var(--ink);
}

/* ===== PRODUCT GRID ===== */
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;padding:0.6rem 1rem 1rem;}
.card{
  background:var(--paper);
  border-radius:var(--r-md);
  border:2.5px solid var(--ink);
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  transition:transform .15s, box-shadow .15s;
  display:flex;flex-direction:column;
}
.card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);}
.card-img{
  position:relative;height:128px;overflow:hidden;
  background:linear-gradient(135deg,var(--cream),#ffe9d2);
  display:flex;align-items:center;justify-content:center;
  border-bottom:2.5px solid var(--ink);
}
.card-img img.product-img{width:100%;height:100%;object-fit:cover;}
.cat-emoji{font-size:2.4rem;line-height:1;}
.card-badge{
  position:absolute;top:7px;left:7px;
  font-size:0.6rem;font-weight:800;letter-spacing:.4px;
  background:var(--gold);color:var(--ink);
  padding:3px 8px;border-radius:20px;text-transform:uppercase;
  border:1.5px solid var(--ink);
}
.stamp-badge{
  position:absolute;top:6px;right:6px;
  background:var(--flame);color:#fff;
  font-size:0.55rem;font-weight:800;text-transform:uppercase;letter-spacing:.3px;
  padding:4px 7px;border-radius:8px;
  border:1.5px solid var(--ink);
  transform:rotate(7deg);
  box-shadow:1px 2px 0 var(--ink);
}
.card-body{padding:0.7rem 0.75rem 0.8rem;display:flex;flex-direction:column;flex:1;}
.card-title{
  font-family:'Sora',sans-serif;font-size:0.84rem;font-weight:700;
  color:var(--ink);line-height:1.25;margin-bottom:4px;
}
.card-price{
  display:inline-block;
  font-size:0.85rem;font-weight:800;color:#fff;background:var(--ink);
  padding:1px 8px;border-radius:6px;margin-bottom:6px;width:fit-content;
}
.card-desc{font-size:0.7rem;color:var(--muted);line-height:1.4;margin-bottom:8px;flex:1;}
.btn-wa{
  width:100%;
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:36px;border-radius:10px;
  border:2px solid var(--ink);
  cursor:pointer;background:var(--wa);color:#fff;
  font-size:0.72rem;font-weight:700;
  transition:background .15s, transform .12s;
}
.btn-wa:hover{background:var(--wa-dark);}
.btn-wa:active{transform:scale(.97);}

/* ===== DETAIL DRAWER ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(26,26,46,.55);z-index:500;
  display:flex;align-items:flex-end;backdrop-filter:blur(2px);
}
.modal-overlay.hidden{display:none;}
.modal-box{
  background:var(--cream);
  border-radius:24px 24px 0 0;
  border-top:3px solid var(--ink);
  width:100%;max-height:92vh;overflow-y:auto;padding:1.1rem 1.1rem 1.6rem;
}
.modal-handle{display:block;width:38px;height:5px;border-radius:3px;background:var(--ink);opacity:.25;margin:0 auto 0.9rem;}
.close-btn{
  background:var(--paper);border:2px solid var(--ink);
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  font-size:1rem;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.detail-img-wrap{
  border-radius:16px;border:2.5px solid var(--ink);overflow:hidden;
  margin-bottom:0.9rem;height:180px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--cream),#ffe9d2);
}
.detail-img-wrap img{width:100%;height:100%;object-fit:cover;}
.detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.detail-top h2{font-size:1.2rem;font-weight:800;letter-spacing:-0.3px;line-height:1.2;}
.detail-price{
  font-size:0.95rem;font-weight:800;color:#fff;background:var(--flame);
  padding:4px 11px;border-radius:8px;border:2px solid var(--ink);white-space:nowrap;
}
.detail-shop{
  display:flex;align-items:center;gap:5px;
  font-size:0.75rem;color:var(--muted);font-weight:600;margin-bottom:0.9rem;
}
.detail-shop i{color:var(--flame);}
.detail-desc{
  color:var(--ink);font-size:0.88rem;line-height:1.6;margin-bottom:1.1rem;
}
.btn-full-wa{
  width:100%;padding:0.9rem;border-radius:30px;
  border:2.5px solid var(--ink);cursor:pointer;
  font-size:0.92rem;font-weight:700;font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--wa);color:#fff;
  transition:background .15s;
}
.btn-full-wa:hover{background:var(--wa-dark);}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:2.5rem 1.5rem;grid-column:1/-1;}
.empty-state .icon{font-size:2.4rem;margin-bottom:0.5rem;}
.empty-state h3{font-size:1rem;margin-bottom:4px;}
.empty-state p{font-size:0.8rem;color:var(--muted);}

/* ===== TOAST ===== */
.toast1{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;
  padding:0.7rem 1.2rem;border-radius:40px;font-size:0.82rem;font-weight:600;
  z-index:1000;white-space:nowrap;border:2px solid var(--ink);
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
.toast1.hidden{display:none;}
.toast1.error{background:var(--flame-dark);}
.toast1.success{background:var(--fresh);}

/* ===== FOOTER STRIP ===== */
.footer-strip{
  margin:1.4rem 1rem 0;
  background:var(--ink);color:#fff;
  border-radius:18px;padding:1rem 1.1rem;
  text-align:center;
}
.footer-strip p{font-size:0.72rem;color:rgba(255,255,255,.6);line-height:1.5;}
.footer-strip strong{color:var(--gold);}

.fade-up{animation:fadeUp .45s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important;}
</style>
</head>

<script>

  { id:'r3', sellerId:'ramvee', shopName:'Ramvee Fresh Food', whatsapp:'27832871780', title:'Chicken Full Plate', price:90, category:'Food', description:'Full chicken plate for a hearty meal.', tag:'Best Value', images:['https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwpKY1tXO_A0sj2W2Y44QfhpTOLx-cZ7v_G_gSG4756bHQQb4Dqu4B3hG9&s=10'], createdAt: Date.now()-3 },
  { id:'r4', sellerId:'ramvee', shopName:'Ramvee Fresh Food', whatsapp:'27832871780', title:'Tripe (Magulu) Half Plate', price:60, category:'Food', description:'Traditional tripe cooked with rich spices.', images:['https://i.ytimg.com/vi/137cIwVf4ko/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLCMutywUpd-i8JFPTSnrEXMUyB_9A'], createdAt: Date.now()-4 },

];

let allListings = [...DEMO_PRODUCTS];
let searchQ = '';
let sortBy = 'newest';

const $ = id => document.getElementById(id);
function esc(s){ if(!s)return''; return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function catEmoji(cat){ return{Food:'🍔'}[cat]||'🍽️'; }
function formatPrice(p){ return 'R'+Number(p).toFixed(0); }
let toastTimer;
function toast1(msg,type='',dur=3000){ const el=$('toast1'); if(!el)return; el.textContent=msg; el.className='toast1 '+(type||''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{if(el)el.className='toast1 hidden';},dur); }

function filteredListings(){
  let arr=[...allListings];
  if(searchQ.trim()){ const q=searchQ.toLowerCase(); arr=arr.filter(l=>(l.title||'').toLowerCase().includes(q)||(l.description||'').toLowerCase().includes(q)); }
  if(sortBy==='price-asc') arr.sort((a,b)=>a.price-b.price);
  else if(sortBy==='price-desc') arr.sort((a,b)=>b.price-a.price);
  else arr.sort((a,b)=>b.createdAt-a.createdAt);
  return arr;
}

function renderListings(){
  const arr=filteredListings();
  const grid=$('cards-grid'), rc=$('result-count');
  if(!grid||!rc) return;
  rc.textContent=`${arr.length} dish${arr.length!==1?'es':''} on the menu`;
  if(arr.length===0){
    grid.innerHTML=`<div class="empty-state"><div class="icon">🍽️</div><h3>Nothing matches that search</h3><p>Try a different dish name.</p></div>`;
    return;
  }
  grid.innerHTML=arr.map((item,i)=>{
    const hasImg = item.images && item.images[0];
    const imgHtml = hasImg
      ? `<img class="product-img" src="${item.images[0]}" alt="${esc(item.title)}" loading="lazy">`
      : `<span class="cat-emoji">${catEmoji(item.category)}</span>`;
    return `<div class="card fade-up" style="animation-delay:${i*0.04}s" data-id="${item.id}">
      <div class="card-img">
        ${imgHtml}
        <span class="card-badge">${esc(item.category)}</span>
        ${item.tag ? `<span class="stamp-badge">${esc(item.tag)}</span>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${esc(item.title)}</div>
        <div class="card-price">${formatPrice(item.price)}</div>
        <p class="card-desc">${esc((item.description||'').substring(0,60))}${(item.description||'').length>60?'…':''}</p>
        <button class="btn-wa" onclick="event.stopPropagation();waContact('${item.whatsapp}','${esc(item.title)}','${esc(item.shopName)}')">
          <i class="fab fa-whatsapp"></i> Order on WhatsApp
        </button>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.card[data-id]').forEach(c=>c.addEventListener('click',(e)=>{
    if(e.target.closest('.btn-wa')) return;
    openDetail(c.dataset.id);
  }));
}

function waContact(wa,title,shop){
  const clean=(wa||'').replace(/\D/g,'');
  if(!clean){ toast1('No WhatsApp number on file','error'); return; }
  const msg = `Hi! I'd like to order the ${title} from ${shop} 🍽️ — is it available right now?`;
  window.open(`https://wa.me/${clean}?text=${encodeURIComponent(msg)}`,'_blank');
}

function openDetail(id){
  const p=allListings.find(l=>l.id===id); if(!p) return;
  const dc=$('detail-content'); if(!dc) return;
  const hasImg = p.images && p.images[0];
  dc.innerHTML = `
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:0.5rem;">
      <button class="close-btn" onclick="document.getElementById('detail-drawer').classList.add('hidden')">&times;</button>
    </div>
    <div class="detail-img-wrap">
      ${hasImg ? `<img src="${p.images[0]}" alt="${esc(p.title)}">` : `<span class="cat-emoji" style="font-size:3rem;">${catEmoji(p.category)}</span>`}
    </div>
    <div class="detail-top">
      <h2>${esc(p.title)}</h2>
      <div class="detail-price">${formatPrice(p.price)}</div>
    </div>
    <div class="detail-shop"><i class="fas fa-store"></i> ${esc(p.shopName)}</div>
    <p class="detail-desc">${esc(p.description||'No description.')}</p>
    <button class="btn-full-wa" onclick="waContact('${p.whatsapp}','${esc(p.title)}','${esc(p.shopName)}')">
      <i class="fab fa-whatsapp"></i> Order on WhatsApp
    </button>
  `;
  $('detail-drawer').classList.remove('hidden');
}

document.addEventListener('DOMContentLoaded',()=>{
  const si=$('market-search'); if(si) si.addEventListener('input',e=>{searchQ=e.target.value;renderListings();});
  const sb=$('search-btn'); if(sb) sb.addEventListener('click',()=>renderListings());
  const ss=$('sort-select'); if(ss) ss.addEventListener('change',e=>{sortBy=e.target.value;renderListings();});
  const dd=$('detail-drawer'); if(dd) dd.addEventListener('click',e=>{if(e.target===dd)dd.classList.add('hidden');});
});

renderListings();
</script>
</body>
</html>
