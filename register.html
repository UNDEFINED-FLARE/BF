<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://timetable.univen.ac.za/images/univen-crest.png" type="image/png">
  <title>Student Records </title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- html2pdf (library for PDF generation) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <!-- Firebase SDKs (must load BEFORE using firebase) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: #f4f7fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .app {
      max-width: 1100px;
      width: 100%;
    }
    h1 {
      font-weight: 400;
      font-size: 2rem;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 3px solid #3b82f6;
      padding-bottom: 0.5rem;
    }
    h1 i {
      color: #3b82f6;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 1.8rem 2rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
      margin-bottom: 2rem;
      transition: 0.2s;
    }
    .form-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem 1.8rem;
      align-items: flex-end;
    }
    .field-group {
      flex: 1 0 180px;
    }
    .field-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 0.3rem;
      letter-spacing: 0.3px;
    }
    .field-group input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 0.95rem;
      background: #fafcff;
      transition: 0.2s;
    }
    .field-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
      background: white;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }
    .btn {
      border: none;
      background: #eef2f6;
      padding: 0.7rem 1.6rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.2s;
      color: #1e293b;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
      box-shadow: 0 4px 8px rgba(59,130,246,0.25);
    }
    .btn-primary:hover {
      background: #2563eb;
      transform: scale(1.01);
    }
    .btn-success {
      background: #10b981;
      color: white;
      box-shadow: 0 4px 8px rgba(16,185,129,0.25);
    }
    .btn-success:hover {
      background: #059669;
    }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #cbd5e1;
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }
    .btn-pdf {
      background: #8b5cf6;
      color: white;
      box-shadow: 0 4px 8px rgba(139,92,246,0.25);
    }
    .btn-pdf:hover {
      background: #7c3aed;
    }
    .student-list {
      background: white;
      border-radius: 20px;
      padding: 1.5rem 1.8rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.04);
    }
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .list-header h2 {
      font-weight: 500;
      font-size: 1.3rem;
      color: #0f172a;
    }
    .badge {
      background: #e2e8f0;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
    }
    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #eef2f6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th {
      background: #f8fafc;
      text-align: left;
      padding: 0.9rem 1rem;
      font-weight: 600;
      color: #1e293b;
      border-bottom: 2px solid #e2e8f0;
    }
    td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #f1f5f9;
      color: #1e293b;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .empty-row td {
      text-align: center;
      color: #94a3b8;
      padding: 2rem 1rem;
      font-style: italic;
    }
    .action-icon {
      color: #ef4444;
      cursor: pointer;
      transition: 0.15s;
      font-size: 1rem;
      padding: 0.3rem 0.5rem;
      border-radius: 30px;
    }
    .action-icon:hover {
      background: #fee2e2;
      color: #b91c1c;
    }
    .toast {
      background: #0f172a;
      color: white;
      padding: 0.7rem 1.5rem;
      border-radius: 40px;
      font-size: 0.9rem;
      display: inline-block;
    }
    #pdfContent {
      background: white;
      padding: 1.5rem;
      border-radius: 16px;
      margin-top: 0.5rem;
    }
    /* responsive */
    @media (max-width: 640px) {
      .card { padding: 1.2rem; }
      .form-grid { flex-direction: column; }
      .btn-group { flex-wrap: wrap; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="pageName">
    <div style="display:flex;align-items:center;gap:8px;">
      <img src="https://timetable.univen.ac.za/images/univen-crest.png" style="width:60px;height:60px;border-radius:6px;" alt="">
      <div>

      </div>
    </div>

  <!-- Form card -->
  <div class="card">
    <div class="form-grid" id="studentForm">
      <div class="field-group">
        <label><i class="fas fa-id-badge"></i> Student Number</label>
        <input type="text" id="studentNumber" placeholder="e.g. 26000219" />
      </div>
      <div class="field-group">
        <label><i class="fas fa-user"></i> Full Name</label>
        <input type="text" id="studentName" placeholder="e.g. Karabo Kekana" />
      </div>
      <div class="field-group">
        <label><i class="fas fa-phone-alt"></i> Phone Number</label>
        <input type="text" id="studentPhone" placeholder="+27 608921150" />
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus-circle"></i> Add</button>
        <button class="btn btn-outline" id="clearFormBtn"><i class="fas fa-undo-alt"></i> Clear</button>
      </div>
    </div>
    <!-- hidden update id -->
    <input type="hidden" id="updateId" value="" />
  </div>

  <!-- List + PDF card -->
  <div class="student-list">
    <div class="list-header">
      <h2><i class="fas fa-list-ul" style="color:#3b82f6;"></i> Enrolled Students</h2>
      <div style="display: flex; gap: 0.6rem; flex-wrap: wrap;">
        <button class="btn btn-pdf" id="pdfBtn"><i class="fas fa-file-pdf"></i> PDF List</button>
        <span class="badge" id="countBadge">0</span>
      </div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr><th>#</th><th>Student No.</th><th>Name</th><th>Phone</th><th style="width:60px;">Action</th></tr>
        </thead>
        <tbody id="studentTableBody">
          <tr class="empty-row"><td colspan="5">No students added yet.</td></tr>
        </tbody>
      </table>
    </div>
    <!-- hidden PDF content area (used for pdf generation) -->
    <div id="pdfContent" style="display: none;"></div>
  </div>
</div>

<script>
  // ========== WAIT FOR FIREBASE TO LOAD ==========
  document.addEventListener('DOMContentLoaded', function() {
    
    // Check if Firebase is available
    if (typeof firebase === 'undefined') {
      alert('Firebase failed to load. Please check your internet connection and try again.');
      return;
    }

    // ========== FIREBASE CONFIG ==========
    // IMPORTANT: Replace with your own Firebase config
    const firebaseConfig = {
apiKey: "AIzaSyC9z5TmK1aJUulrEIscwe9MZ5qcusJMOpc",
    authDomain: "blueflare-47c29.firebaseapp.com",
    projectId: "blueflare-47c29",
    storageBucket: "blueflare-47c29.firebasestorage.app",
    messagingSenderId: "348839866641",
    appId: "1:348839866641:web:64fb433419c80c15dddcb0"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const db = firebase.database();
    const studentsRef = db.ref('students');

    // ========== DOM REFS ==========
    const studentNumber = document.getElementById('studentNumber');
    const studentName = document.getElementById('studentName');
    const studentPhone = document.getElementById('studentPhone');
    const addBtn = document.getElementById('addBtn');
    const clearFormBtn = document.getElementById('clearFormBtn');
    const updateIdInput = document.getElementById('updateId');
    const tbody = document.getElementById('studentTableBody');
    const countBadge = document.getElementById('countBadge');
    const pdfBtn = document.getElementById('pdfBtn');
    const pdfContent = document.getElementById('pdfContent');

    // ========== UTILITY ==========
    function clearForm() {
      studentNumber.value = '';
      studentName.value = '';
      studentPhone.value = '';
      updateIdInput.value = '';
      addBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Add';
      addBtn.className = 'btn btn-primary';
    }

    // ========== CRUD ==========
    function loadStudents() {
      studentsRef.on('value', snapshot => {
        const data = snapshot.val();
        let html = '';
        let count = 0;
        if (data) {
          const keys = Object.keys(data);
          count = keys.length;
          keys.forEach((key, index) => {
            const s = data[key];
            html += `
              <tr>
                <td>${index + 1}</td>
                <td><strong>${s.studentNumber || ''}</strong></td>
                <td>${s.studentName || ''}</td>
                <td>${s.studentPhone || ''}</td>
                <td>
    </td>
              </tr>
            `;
          });
        } else {
          html = `<tr class="empty-row"><td colspan="5">📭 No students added yet.</td></tr>`;
        }
        tbody.innerHTML = html;
        countBadge.textContent = count;
        
        // attach event listeners to action icons
        document.querySelectorAll('.action-icon[data-action="edit"]').forEach(el => {
          el.onclick = (e) => {
            const id = el.dataset.id;
            studentsRef.child(id).once('value', snap => {
              const data = snap.val();
              if (data) {
                studentNumber.value = data.studentNumber || '';
                studentName.value = data.studentName || '';
                studentPhone.value = data.studentPhone || '';
                updateIdInput.value = id;
                addBtn.innerHTML = '<i class="fas fa-save"></i> Update';
                addBtn.className = 'btn btn-success';
              }
            });
          };
        });
        document.querySelectorAll('.action-icon[data-action="delete"]').forEach(el => {
          el.onclick = () => {
            const id = el.dataset.id;
            if (confirm('Delete this student record?')) {
              studentsRef.child(id).remove()
                .then(() => { /* auto-refresh via listener */ })
                .catch(err => alert('Error deleting: ' + err.message));
            }
          };
        });
      });
    }

    // ========== ADD / UPDATE ==========
    function handleAddOrUpdate() {
      const num = studentNumber.value.trim();
      const name = studentName.value.trim();
      const phone = studentPhone.value.trim();
      if (!num || !name || !phone) {
        alert('Please fill in all fields (Student No., Name, Phone).');
        return;
      }
      const updateId = updateIdInput.value;
      const payload = { studentNumber: num, studentName: name, studentPhone: phone };

      if (updateId) {
        // UPDATE
        studentsRef.child(updateId).update(payload)
          .then(() => {
            clearForm();
            alert('✅ Student updated successfully!');
          })
          .catch(err => alert('Update error: ' + err.message));
      } else {
        // ADD (push)
        studentsRef.push(payload)
          .then(() => {
            clearForm();
            alert('✅ Student added!');
          })
          .catch(err => alert('Add error: ' + err.message));
      }
    }

    // ========== PDF GENERATION ==========
    function generatePDF() {
      studentsRef.once('value', snapshot => {
        const data = snapshot.val();
        if (!data) {
          alert('No student records to export.');
          return;
        }
        const keys = Object.keys(data);
        let tableRows = '';
        keys.forEach((key, idx) => {
          const s = data[key];
          tableRows += `
            <tr>
              <td style="padding: 0.7rem 0.5rem; border-bottom: 1px solid #e2e8f0;">${idx + 1}</td>
              <td style="padding: 0.7rem 0.5rem; border-bottom: 1px solid #e2e8f0;">${s.studentNumber || ''}</td>
              <td style="padding: 0.7rem 0.5rem; border-bottom: 1px solid #e2e8f0;">${s.studentName || ''}</td>
              <td style="padding: 0.7rem 0.5rem; border-bottom: 1px solid #e2e8f0;">${s.studentPhone || ''}</td>
            </tr>
          `;
        });

        const pdfHtml = `
          <div style="font-family: 'Segoe UI', sans-serif; padding: 2rem 1.5rem; max-width: 100%;">
            <h2 style="color: #0f172a; border-bottom: 3px solid #3b82f6; padding-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
              <span>📋 Student Records</span>
              <span style="font-size: 0.8rem; font-weight: normal; color: #475569; margin-left: auto;">Generated: ${new Date().toLocaleString()}</span>
            </h2>
            <table style="width: 100%; border-collapse: collapse; margin-top: 1.5rem; font-size: 0.95rem;">
              <thead>
                <tr style="background: #f1f5f9; border-bottom: 2px solid #cbd5e1;">
                  <th style="padding: 0.7rem 0.5rem; text-align: left;">#</th>
                  <th style="padding: 0.7rem 0.5rem; text-align: left;">Student Number</th>
                  <th style="padding: 0.7rem 0.5rem; text-align: left;">Full Name</th>
                  <th style="padding: 0.7rem 0.5rem; text-align: left;">Phone Number</th>
                </tr>
              </thead>
              <tbody>
                ${tableRows}
              </tbody>
            </table>
            <p style="margin-top: 2rem; color: #64748b; font-size: 0.8rem; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 1rem;">
              Total ${keys.length} student(s)
            </p>
          </div>
        `;

        pdfContent.innerHTML = pdfHtml;
        const element = pdfContent;

        const opt = {
          margin:        [0.5, 0.5, 0.5, 0.5],
          filename:     `students_${new Date().toISOString().slice(0,10)}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, letterRendering: true, useCORS: true },
          jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save().then(() => {
          pdfContent.innerHTML = '';
        }).catch(err => {
          alert('PDF generation error: ' + err);
        });
      });
    }

    // ========== EVENT LISTENERS ==========
    addBtn.addEventListener('click', handleAddOrUpdate);
    clearFormBtn.addEventListener('click', clearForm);
    pdfBtn.addEventListener('click', generatePDF);

    document.querySelectorAll('#studentForm input').forEach(inp => {
      inp.addEventListener('keypress', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleAddOrUpdate();
        }
      });
    });

    // ========== INIT ==========
    loadStudents();
    clearForm();
    
  }); // end DOMContentLoaded
</script>

</body>
</html>
